# 実装課題の練習の採点基準表
#
# 採点Skillがこのファイルを読んで採点する。
# 項目ごとに個別の満点を持ち、確認項目は独立に加点する（積み上げ式ではない）。
# 質問係は、実装を見たうえで、判断のための質問をする。点は自己申告と受け答えから付ける。

# 採点側に渡す情報の置き場。
# 出題側が、問題文HTMLのHTMLコメントに仕込む。採点側はHTMLファイルを直接読んで取り出す。
hidden_info:
  location: 問題文HTMLのHTMLコメント
  contains:
    - クリティカルなエラーの一覧（個数は無制限）
    - 軽微なエラーの一覧
    - 質問するケース

items:
  # --- TDD進行（満点3） -------------------------------------------------
  - id: tdd_progress
    name: TDD進行
    max_points: 3
    judged_by: 質問係が「リファクタできましたか」のように聞いて判断する（自己申告）
    checks:
      - id: red
        label: テストを先に書いた
        points: 1
      - id: green
        label: 正常系の実装がテストを通った
        points: 1
        note: 異常系は「エラーの扱い」で評価するので、ここでは見ない
      - id: refactor
        label: Refactorした
        points: 1
        requires: green
    note: 「Redだけ書けた」と「テストなしで実装だけ書いて動いた」は、どちらも1点で同点

  # --- エラーの扱い（満点は課題ごとに変わる） ----------------------------
  - id: error_handling
    name: エラーの扱い
    max_points: 課題ごとに変わる（仕込まれたエラーの数と種類による）
    scoring: per_error
    note: 満点が課題ごとに変わるので、FBには「点／満点」で書く
    per_error_points:
      critical:
        implemented: 3
        explained: 2
      minor:
        implemented: 2
        explained: 1
    definitions:
      implemented: そのエラーへの対応が実装されている
      explained: そのエラーについて、実装の有無にかかわらず、どう対応するかを説明できる
    note_on_points: クリティカルの説明と軽微の実装は、どちらも2点で同点

  # --- 説明（満点2） ---------------------------------------------------
  - id: explanation
    name: 説明
    max_points: 2
    judged_by: 質問係が、実装の工夫した点と、採用しなかった案、その根拠を必ず聞く
    levels:
      - points: 2
        label: イメージを実装に落とし込む方法まで答えられた
      - points: 1
        label: 問題に対する基本的な流れ（こういうものがあって、こう流れればいける、というイメージ）を説明できた
      - points: 0
        label: 「AIがそう言ったので」としか答えられない

# FBドキュメントの書き方。結果は問題文リポジトリに、ドキュメントとして永続化する。
feedback:
  scope: その回の出来だけを評価する（過去の回は踏まえない）
  contents:
    - 各項目の点数（点／満点）
    - 強い点
    - 弱い点
  rule: 強い点・弱い点のどちらにも、該当する項目の点数を併記する
